<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatuWold</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section id="loginScreen" class="card">
      <h1>ChatuWold</h1>
      <p class="subtitle">Inicia sessió per entrar</p>

      <form id="loginForm">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required>

        <label for="password">Contrasenya</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <label class="remember">
          <input id="remember" type="checkbox">
          <span>Recorda'm</span>
        </label>

        <button type="submit">Iniciar sessió</button>
        <p id="loginMessage" class="message" aria-live="polite"></p>
      </form>
    </section>

    <section id="waitingScreen" class="card hidden">
      <div class="loader" aria-hidden="true"></div>
      <h2>Esperant l’altra persona…</h2>
      <p>Quan els dos premeu «Acceptar», la web es desbloquejarà.</p>
      <button id="acceptButton" type="button">Acceptar</button>
      <p id="acceptStatus" class="message" aria-live="polite"></p>
    </section>

    <section id="homeScreen" class="card hidden">
      <div class="welcome">🎉</div>
      <h2>Benvinguts!</h2>
      <p>Els dos heu acceptat. La web està desbloquejada. 🔓</p>
      <button id="logoutButton" type="button">Tancar sessió</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
